# Display names for Kotlin Fonts & Colors categories (shown in Tools > Options > Fonts & Colors)
# Names match IntelliJ IDEA's Kotlin highlighting settings panel.

# Lexical
IDENTIFIER=Identifier
KEYWORD=Keyword
KOTLIN_NUMBER=Number
KOTLIN_OPERATION_SIGN=Operation sign
KOTLIN_PARENTHESIS=Parentheses
KOTLIN_BRACES=Braces
KOTLIN_FUNCTION_LITERAL_BRACES_AND_ARROW=Lambda braces and arrow
KOTLIN_BRACKETS=Brackets
KOTLIN_COMMA=Comma
KOTLIN_SEMICOLON=Semicolon
KOTLIN_DOT=Dot
KOTLIN_SAFE_ACCESS=Safe access (?.)
KOTLIN_ARROW=Arrow (->)
STRING=String
KOTLIN_STRING_ESCAPE=String escape
KOTLIN_INVALID_STRING_ESCAPE=Invalid string escape
SINGLE_LINE_COMMENT=Line comment
MULTI_LINE_COMMENT=Block comment
KOTLIN_DOC_COMMENT=KDoc comment
KDOC_TAG_NAME=KDoc tag
KDOC_LINK=KDoc link
ANNOTATION=Annotation
WHITESPACE=Whitespace

# Classes
KOTLIN_CLASS=Class
KOTLIN_ABSTRACT_CLASS=Abstract class
KOTLIN_TRAIT=Interface
KOTLIN_OBJECT=Object
KOTLIN_ENUM=Enum class
KOTLIN_TYPE_ALIAS=Type alias
KOTLIN_ANNOTATION=Annotation class
KOTLIN_TYPE_PARAMETER=Type parameter

# Functions
KOTLIN_FUNCTION_DECLARATION=Function declaration
KOTLIN_FUNCTION_CALL=Function call
KOTLIN_PACKAGE_FUNCTION_CALL=Top-level function call
KOTLIN_EXTENSION_FUNCTION_CALL=Extension function call
KOTLIN_CONSTRUCTOR_CALL=Constructor call
KOTLIN_CONSTRUCTOR=Constructor declaration
KOTLIN_SUSPEND_FUNCTION_CALL=Suspend function call
KOTLIN_DYNAMIC_FUNCTION_CALL=Dynamic function call
KOTLIN_VARIABLE_AS_FUNCTION_CALL=Variable used as function call
KOTLIN_VARIABLE_AS_FUNCTION_LIKE_CALL=Variable used as function-like call

# Variables / Properties
KOTLIN_LOCAL_VARIABLE=Local variable
KOTLIN_PARAMETER=Parameter
KOTLIN_WRAPPED_INTO_REF=Captured mutable variable
KOTLIN_INSTANCE_PROPERTY=Instance property
KOTLIN_PACKAGE_PROPERTY=Top-level property
KOTLIN_EXTENSION_PROPERTY=Extension property
KOTLIN_SYNTHETIC_EXTENSION_PROPERTY=Android extensions property
KOTLIN_BACKING_FIELD_VARIABLE=Backing field
KOTLIN_ENUM_ENTRY=Enum entry
KOTLIN_INSTANCE_PROPERTY_CUSTOM_PROPERTY_DECLARATION=Property (custom accessor)
KOTLIN_PACKAGE_PROPERTY_CUSTOM_PROPERTY_DECLARATION=Top-level property (custom accessor)
KOTLIN_MUTABLE_VARIABLE=Mutable variable
KOTLIN_CLOSURE_DEFAULT_PARAMETER=It (implicit lambda parameter)
KOTLIN_FUNCTION_LITERAL_DEFAULT_PARAMETER=It (implicit lambda parameter)
KOTLIN_DYNAMIC_PROPERTY_CALL=Dynamic property

# Smart casts
KOTLIN_SMART_CAST_VALUE=Smart cast value
KOTLIN_SMART_CONSTANT=Smart cast constant
KOTLIN_SMART_CAST_RECEIVER=Smart cast receiver

# Misc
KOTLIN_LABEL=Label
KOTLIN_NAMED_ARGUMENT=Named argument
KOTLIN_ANNOTATION_ATTRIBUTE_NAME_ATTRIBUTES=Annotation attribute name
KOTLIN_PROPERTY_WITH_BACKING_FIELD=Property with backing field
KOTLIN_COROUTINE_DEBUGGER_VALUE=Coroutine debugger value

# Diagnostics
KOTLIN_DEPRECATED=Deprecated symbol
KOTLIN_RESOLVED_TO_ERROR=Resolved to error
KOTLIN_DEBUG_INFO=Debug info
