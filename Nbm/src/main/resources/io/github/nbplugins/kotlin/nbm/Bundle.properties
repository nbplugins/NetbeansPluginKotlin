# Display names for Kotlin Fonts & Colors categories (shown in Tools > Options > Fonts & Colors).
#
# Names and grouping mirror IntelliJ IDEA's Kotlin color settings page.
# Groups use "/" as separator (IDEA uses "//"); the panel sorts alphabetically.
#
# Sources:
#   - KotlinBundle items: plugins/kotlin/base/resources/resources-en/messages/KotlinBundle.properties
#     (keys: highlighter.descriptor.text.*)
#   - OptionsBundle items: platform/ide-core/.../messages/OptionsBundle.properties
#     (keys: options.java.attribute.descriptor.*)

# Top-level (no group in IDEA — from OptionsBundle without group prefix)
IDENTIFIER=Identifier
KOTLIN_NUMBER=Number
WHITESPACE=Whitespace

# Keywords
KEYWORD=Keywords/Keyword

# Braces and Operators (OptionsBundle + KotlinBundle)
KOTLIN_OPERATION_SIGN=Braces and Operators/Operator sign
KOTLIN_PARENTHESIS=Braces and Operators/Parentheses
KOTLIN_BRACES=Braces and Operators/Braces
KOTLIN_FUNCTION_LITERAL_BRACES_AND_ARROW=Braces and Operators/Lambda expression braces and arrow
KOTLIN_BRACKETS=Braces and Operators/Brackets
KOTLIN_COMMA=Braces and Operators/Comma
KOTLIN_SEMICOLON=Braces and Operators/Semicolon
KOTLIN_DOT=Braces and Operators/Dot
KOTLIN_SAFE_ACCESS=Braces and Operators/Safe access dot
KOTLIN_ARROW=Braces and Operators/Arrow

# String (OptionsBundle)
STRING=String/String text
KOTLIN_STRING_ESCAPE=String/Escape in string and template braces
KOTLIN_INVALID_STRING_ESCAPE=String/Escape Sequence/Invalid

# Comments (OptionsBundle + KotlinBundle)
SINGLE_LINE_COMMENT=Comments/Line comment
MULTI_LINE_COMMENT=Comments/Block comment
KOTLIN_DOC_COMMENT=Comments/KDoc/KDoc comment
KDOC_TAG_NAME=Comments/KDoc/KDoc tag
KDOC_LINK=Comments/KDoc/Link in KDoc tag

# Annotation
ANNOTATION=Annotation/Annotation name
KOTLIN_ANNOTATION=Annotation/Annotation class
KOTLIN_ANNOTATION_ATTRIBUTE_NAME_ATTRIBUTES=Annotation/Annotation attribute name

# Classes and Interfaces (OptionsBundle)
KOTLIN_CLASS=Classes and Interfaces/Class
KOTLIN_ABSTRACT_CLASS=Classes and Interfaces/Abstract class
KOTLIN_TRAIT=Classes and Interfaces/Interface
KOTLIN_OBJECT=Classes and Interfaces/Object
KOTLIN_ENUM=Classes and Interfaces/Enum
KOTLIN_ENUM_ENTRY=Classes and Interfaces/Enum entry
KOTLIN_TYPE_ALIAS=Classes and Interfaces/Type alias

# Parameters (OptionsBundle: type.parameter → Parameters; parameter → Parameters)
KOTLIN_TYPE_PARAMETER=Parameters/Type parameter
KOTLIN_PARAMETER=Parameters/Parameter
KOTLIN_FUNCTION_LITERAL_DEFAULT_PARAMETER=Parameters/Lambda expression default parameter
KOTLIN_CLOSURE_DEFAULT_PARAMETER=Parameters/Closure default parameter

# Functions
KOTLIN_FUNCTION_DECLARATION=Functions/Function declaration
KOTLIN_FUNCTION_CALL=Functions/Function call
KOTLIN_PACKAGE_FUNCTION_CALL=Functions/Package-level function call
KOTLIN_EXTENSION_FUNCTION_CALL=Functions/Extension function call
KOTLIN_CONSTRUCTOR_CALL=Functions/Constructor call
KOTLIN_CONSTRUCTOR=Functions/Constructor declaration
KOTLIN_SUSPEND_FUNCTION_CALL=Functions/Suspend function call
KOTLIN_DYNAMIC_FUNCTION_CALL=Functions/Dynamic function call

# Properties and Variables
KOTLIN_LOCAL_VARIABLE=Properties and Variables/Local variable or value
KOTLIN_WRAPPED_INTO_REF=Properties and Variables/Variables and values captured in a closure
KOTLIN_INSTANCE_PROPERTY=Properties and Variables/Instance property
KOTLIN_PACKAGE_PROPERTY=Properties and Variables/Package-level property
KOTLIN_EXTENSION_PROPERTY=Properties and Variables/Extension property
KOTLIN_SYNTHETIC_EXTENSION_PROPERTY=Properties and Variables/Synthetic extension property
KOTLIN_BACKING_FIELD_VARIABLE=Properties and Variables/Backing field variable
KOTLIN_INSTANCE_PROPERTY_CUSTOM_PROPERTY_DECLARATION=Properties and Variables/Instance property with custom property declarations
KOTLIN_PACKAGE_PROPERTY_CUSTOM_PROPERTY_DECLARATION=Properties and Variables/Package-level property with custom property declarations
KOTLIN_MUTABLE_VARIABLE=Properties and Variables/Var (mutable variable, parameter or property)
KOTLIN_DYNAMIC_PROPERTY_CALL=Properties and Variables/Dynamic property
KOTLIN_VARIABLE_AS_FUNCTION_CALL=Properties and Variables/Variable as function call
KOTLIN_VARIABLE_AS_FUNCTION_LIKE_CALL=Properties and Variables/Variable as function-like call

# Smart-casts
KOTLIN_SMART_CAST_VALUE=Smart-casts/Smart-cast value
KOTLIN_SMART_CONSTANT=Smart-casts/Smart constant
KOTLIN_SMART_CAST_RECEIVER=Smart-casts/Smart-cast implicit receiver

# Top-level misc (no group in IDEA)
KOTLIN_LABEL=Label
KOTLIN_NAMED_ARGUMENT=Named argument
KOTLIN_PROPERTY_WITH_BACKING_FIELD=Property with backing field
KOTLIN_COROUTINE_DEBUGGER_VALUE=Coroutine debugger value

# Diagnostics
KOTLIN_DEPRECATED=Deprecated symbol
KOTLIN_RESOLVED_TO_ERROR=Resolved to error
KOTLIN_DEBUG_INFO=Debug info
